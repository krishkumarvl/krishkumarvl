<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330">
<defs>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#12351d" stroke-width="1"/>
  </pattern>
  <style>
    .px { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: 1px; }
    .small { font-family: "Courier New", monospace; font-size: 13px; font-weight: 700; letter-spacing: .5px; }
    .green { fill:#58ff72; }
    .white { fill:#f5f5f5; }
    .cyan { fill:#59d9ff; }
  </style>
</defs>
<title>Signature Skin - Build in Public</title>
<rect width="700" height="330" fill="#020706"/>
<rect width="700" height="330" fill="url(#grid)" opacity=".55"/>

<rect x="1" y="1" width="698" height="328" rx="12" fill="none" stroke="#58ff72" stroke-width="2"/>
<text x="22" y="43" class="small green">04  SIGNATURE SKINS</text>
<text x="560" y="43" class="small white">KRYPhix</text>
<!-- skyline -->
