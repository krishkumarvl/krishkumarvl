  <path d="M50 275 L50 165 L90 165 L90 275"/>
  <path d="M62 165 V145 M78 165 V145"/>
  <path d="M110 275 L110 215 L185 165 L230 275"/>
  <path d="M155 191 L155 275"/>
  <path d="M230 275 L230 135 L275 135 L275 275"/>
  <path d="M245 135 V115 M260 135 V115"/>
  <path d="M300 275 L300 190 L350 190 L350 275"/>
  <path d="M380 275 L380 150 L415 150 L415 275"/>
  <path d="M430 275 L430 205 L500 205 L500 275"/>
</g>
