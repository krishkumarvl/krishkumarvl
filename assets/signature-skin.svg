  <rect x="60" y="180" width="8" height="8"/><rect x="75" y="180" width="8" height="8"/>
  <rect x="60" y="200" width="8" height="8"/><rect x="75" y="200" width="8" height="8"/>
  <rect x="245" y="155" width="9" height="9"/><rect x="262" y="155" width="9" height="9"/>
  <rect x="245" y="178" width="9" height="9"/><rect x="262" y="178" width="9" height="9"/>
  <rect x="392" y="175" width="8" height="8"/><rect x="406" y="175" width="8" height="8"/>
</g>
<text x="455" y="145" class="px green" font-size="24">BUILDING</text>
<text x="455" y="175" class="px green" font-size="24">IN PUBLIC</text>
<text x="455" y="205" class="small white">&gt; github.com/krishkumarvl</text>
<line x1="45" y1="285" x2="650" y2="285" stroke="#1b7d31" stroke-width="2"/>
